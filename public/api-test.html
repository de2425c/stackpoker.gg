<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StackPoker API Test</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♠️</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding: 2rem;
            line-height: 1.6;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #3b82f6, #2dd4bf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
        }
        .card-symbols {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            font-size: 1.5rem;
            text-align: center;
        }
        .test-form {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 0.5rem;
            margin-bottom: 2rem;
        }
        textarea {
            width: 100%;
            height: 200px;
            background-color: #334155;
            color: white;
            border: none;
            border-radius: 0.25rem;
            padding: 1rem;
            font-family: 'Inter', sans-serif;
            margin-bottom: 1rem;
            resize: vertical;
        }
        button {
            padding: 0.75rem 2rem;
            border: none;
            background: linear-gradient(to right, #3b82f6, #2dd4bf);
            color: white;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 0.25rem;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .results {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 0.5rem;
            overflow: auto;
        }
        pre {
            color: #94a3b8;
            overflow-x: auto;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #94a3b8;
        }
        .nav {
            text-align: center;
            margin-bottom: 2rem;
        }
        .nav a {
            color: #94a3b8;
            text-decoration: none;
            margin: 0 1rem;
        }
        .nav a:hover {
            color: white;
        }
        .loading {
            text-align: center;
            padding: 2rem;
            display: none;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #3b82f6;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="/">Home</a>
            <a href="/api-test.html">API Test</a>
        </div>
        
        <div class="card-symbols">♠️ ♥️ ♣️ ♦️</div>
        <h1>Hand History Parser API Test</h1>
        
        <div class="test-form">
            <label for="hand-history">Enter Poker Hand History:</label>
            <textarea id="hand-history" placeholder="Paste your poker hand history here...">I'm at a 6-max table with $1/$2 blinds. The dealer is in seat 3. I'm the hero in seat 1 with KcKd and a stack of $205. Player in seat 2 has $190, seat 3 has $310, seat 4 has $245, seat 5 has $180, and seat 6 has $225.

Preflop: UTG folds, I raise to $7, Button calls, SB folds, BB calls.

Flop (Kh 7d 2c): BB checks, I bet $12, Button folds, BB calls.

Turn (Kh 7d 2c 9s): BB checks, I bet $25, BB calls.

River (Kh 7d 2c 9s Ah): BB checks, I bet $40, BB raises to $120, I call.

BB shows JhTh for a missed straight draw. I win the pot of $328 with my set of Kings.</textarea>
            <button id="submit-btn">Parse Hand History</button>
        </div>
        
        <div class="loading">
            <div class="spinner"></div>
            <p>Processing hand history...</p>
        </div>
        
        <div class="results">
            <h2>Results:</h2>
            <pre id="result-json">// Results will appear here</pre>
        </div>
    </div>

    <script>
        document.getElementById('submit-btn').addEventListener('click', async function() {
            const handText = document.getElementById('hand-history').value;
            const resultElement = document.getElementById('result-json');
            const loadingElement = document.querySelector('.loading');
            
            if (!handText.trim()) {
                resultElement.textContent = "Please enter a hand history";
                return;
            }
            
            try {
                resultElement.textContent = "Sending request...";
                loadingElement.style.display = 'block';
                
                const response = await fetch('/api/parse-hand', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ description: handText }),
                });
                
                // Handle non-200 status
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server returned ${response.status}: ${errorText}`);
                }
                
                const data = await response.json();
                loadingElement.style.display = 'none';
                
                resultElement.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                loadingElement.style.display = 'none';
                resultElement.textContent = `Error: ${error.message}`;
            }
        });
    </script>
</body>
</html>
